name: CI / Production Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Verify All Spring Boot Microservices
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Verify Backend Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile & Package Core Microservices
        run: |
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/eureka-server/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/api-gateway/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/auth-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/job-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/profile-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/application-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/notification-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/subscription-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/analytics-service/pom.xml
          mvn -B clean package -Dmaven.test.skip=true -f ./backend/interview-service/pom.xml

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & Verify React Frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Verify Frontend Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Verify Docker Container Builds
  # ─────────────────────────────────────────────────────────────
  verify-docker:
    name: Verify Docker Containerization
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t careonix/frontend:latest ./frontend

      - name: Build Gateway Docker Image
        run: docker build -t careonix/api-gateway:latest ./backend/api-gateway

      # Optional: Push to Docker Hub ONLY if secrets are configured
      - name: Publish to Docker Hub (When Configured)
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push careonix/frontend:latest
          docker push careonix/api-gateway:latest
