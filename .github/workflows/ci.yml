name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Backend Microservices with Maven
        run: |
          mvn -B clean package -DskipTests -f ./backend/eureka-server/pom.xml
          mvn -B clean package -DskipTests -f ./backend/api-gateway/pom.xml
          mvn -B clean package -DskipTests -f ./backend/application-service/pom.xml
          mvn -B clean package -DskipTests -f ./backend/auth-service/pom.xml
          mvn -B clean package -DskipTests -f ./backend/job-service/pom.xml
          mvn -B clean package -DskipTests -f ./backend/profile-service/pom.xml
          mvn -B clean package -DskipTests -f ./backend/notification-service/pom.xml
          mvn -B clean package -DskipTests -f ./backend/subscription-service/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker images
        run: |
          docker build -t careonix/eureka-server:latest ./backend/eureka-server
          docker build -t careonix/api-gateway:latest ./backend/api-gateway
          docker build -t careonix/application-service:latest ./backend/application-service
          docker build -t careonix/notification-service:latest ./backend/notification-service
          docker build -t careonix/subscription-service:latest ./backend/subscription-service
          docker build -t careonix/frontend:latest ./frontend

      # Optional: push Docker images (set DOCKER_USERNAME & DOCKER_PASSWORD secrets in GitHub repo settings)
      - name: Publish Docker images
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push careonix/eureka-server:latest
          docker push careonix/api-gateway:latest
          docker push careonix/application-service:latest
          docker push careonix/notification-service:latest
          docker push careonix/subscription-service:latest
          docker push careonix/frontend:latest
