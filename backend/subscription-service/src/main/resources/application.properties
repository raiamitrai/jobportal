server.port=8087
spring.application.name=subscription-service

# MySQL Database Config (Local WampServer / MySQL Container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/subscriptiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── Razorpay Payment Gateway Config ──────────────────────────────────────────
# Replace with your Razorpay API keys from https://dashboard.razorpay.com
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YourKeyHere}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YourSecretHere}

# ── CORS: Allow frontend to call this service directly ───────────────────────
cors.allowed.origins=http://localhost:3001,http://localhost:3007,http://localhost:5173,http://localhost:3000
