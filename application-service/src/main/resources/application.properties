server.port=8083

# H2 (dev) configuration
spring.datasource.url=jdbc:h2:mem:applicationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT secret for dev (use a strong random value in prod)
jwt.secret=MyDevJwtSecretKeyReplaceWithSecureRandomValue
